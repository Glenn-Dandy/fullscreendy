Builds:
  # commit MUSS der volle 40-stellige Hash sein, kein Tag-Name: ein Tag laesst sich
  # nachtraeglich verschieben, der Build waere dann nicht mehr nachvollziehbar.
  # Der Hash wird beim Taggen von 0.4.7 eingesetzt (git rev-list -n1 v0.4.7).
  # v0.4.6 kommt nicht in Frage: dieser Commit (fdc7ea88...) enthaelt weder das
  # fdroid-Flavor noch den Wrapper noch die Fastlane-Texte.
  - versionName: 0.4.7
    versionCode: 20
    commit: FULL_COMMIT_HASH_OF_TAG_v0.4.7
    subdir: app
    gradle:
      - fdroid

AutoUpdateMode: Version
# Nur stabile Tags bauen – die Pre-Releases heissen vX.Y.Z-dev.N.
UpdateCheckMode: Tags ^v[0-9]+\.[0-9]+\.[0-9]+$
CurrentVersion: 0.4.7
CurrentVersionCode: 20
